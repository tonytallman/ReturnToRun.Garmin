<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 40 40">
  <title>ReturnToRun launcher icon for black-and-white screens</title>
  <!-- The runner from launcher_icon.svg in white, over a black outline so it
       shows on a black or a white background. -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round" stroke="#000000">
    <polyline stroke-width="7" points="23,14 16.5,15 12,19.5"/>
    <polyline stroke-width="7.5" points="18.5,21.5 13,28.5 6,28.5 4,34"/>
    <line stroke-width="8.5" x1="24.2" y1="12.8" x2="18.5" y2="21.5"/>
    <polyline stroke-width="7.5" points="18.5,21.5 27.5,25 28,33 33,34"/>
    <polyline stroke-width="7" points="23.5,14 29.5,17 33.5,12.5"/>
  </g>
  <circle fill="#000000" cx="28.6" cy="5.3" r="5.5"/>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round" stroke="#FFFFFF">
    <polyline stroke-width="4" points="23,14 16.5,15 12,19.5"/>
    <polyline stroke-width="4.5" points="18.5,21.5 13,28.5 6,28.5 4,34"/>
    <line stroke-width="5.5" x1="24.2" y1="12.8" x2="18.5" y2="21.5"/>
    <polyline stroke-width="4.5" points="18.5,21.5 27.5,25 28,33 33,34"/>
    <polyline stroke-width="4" points="23.5,14 29.5,17 33.5,12.5"/>
  </g>
  <circle fill="#FFFFFF" cx="28.6" cy="5.3" r="4"/>
</svg>
